[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnpilot"
version = "0.1.0"
description = "Autonomous vulnerability-management pipeline: feed -> infra -> patch/mitigate -> validate on staging -> recommend"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
vulnpilot = "vulnpilot.__main__:main"

[tool.setuptools]
packages = ["vulnpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
