[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fnh"
version = "0.1.0"
description = "Friendly Neighborhood Helminth: autonomous vuln-management pipeline (feed -> infra -> patch/mitigate -> validate on staging -> promote)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
fnh = "fnh.__main__:main"

[tool.setuptools]
packages = ["fnh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
